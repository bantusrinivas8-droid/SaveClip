<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SaveClip settings</title>
<style>
  body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; width: 320px; color: #16181d; }
  h1 { font-size: 18px; margin: 0 0 4px; } h1 span { color: #e5254a; }
  p { color: #6b7080; margin: 0 0 12px; }
  label { font-weight: 600; display: block; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 9px; border: 1px solid #e3e5ec; border-radius: 8px; font: inherit; }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  button { flex: 1; padding: 9px; border: 0; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  #save { background: linear-gradient(90deg, #e5254a, #ff6a3d); color: #fff; }
  #test { background: #f1f2f6; }
  #status { margin-top: 10px; font-size: 13px; min-height: 20px; }
  .ok { color: #18a058; } .err { color: #d93636; }
  small { color: #6b7080; display: block; margin-top: 12px; }
</style></head>
<body>
  <h1>Save<span>Clip</span></h1>
  <p>Where is your SaveClip website running?</p>
  <label for="server">Server address</label>
  <input id="server" type="url" placeholder="http://127.0.0.1:8000">
  <div class="row"><button id="save">Save</button><button id="test">Test</button></div>
  <div id="status"></div>
  <small>Use <b>http://127.0.0.1:8000</b> when SaveClip runs on this computer, or your Cloudflare link, for example <b>https://saveclip.yourname.workers.dev</b>.<br><br>Only download content you own or have permission to use.</small>
  <script src="options.js"></script>
</body></html>
